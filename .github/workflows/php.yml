name: PHP Build

on:
  push:
    branches: ["dev"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install dependencies
        run: |
          composer install --no-dev --prefer-dist --no-progress || \
          (rm -f composer.lock && composer update --no-dev --prefer-dist --no-progress)

      - name: Build package
        run: |
          mkdir release
          rsync -av \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="tests" \
            --exclude=".env" \
            ./ release/

      - name: Zip package
        run: |
          cd release
          zip -r ../release.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-release
          path: release.zip
